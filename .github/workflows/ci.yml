name: Stacks checks
on: [push, pull_request]
jobs:
  milestone-one:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stacks
          POSTGRES_PASSWORD: stacks
          POSTGRES_DB: stacks_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stacks -d stacks_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://stacks:stacks@localhost:5432/stacks_test
      TEST_DATABASE_URL: postgresql+psycopg://stacks:stacks@localhost:5432/stacks_test
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Backend and migration checks
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
          alembic upgrade head
          alembic check
          pytest -q
          alembic downgrade base
          alembic upgrade head
          alembic check
          python scripts/export_openapi.py
      - name: Mobile and contract checks
        working-directory: mobile
        run: |
          npm ci
          npm ci --prefix ../tooling/api-types
          npm run api:generate
          npm run typecheck
          npm run format:check
          npx expo install --check
          npx expo export --platform web
          git diff --exit-code -- ../backend/openapi.json types/api.generated.ts
